<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Animation</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b0f14;
  font-family:Arial, sans-serif;
  overflow:hidden;
}

/* Button style */
button{
  padding:15px 40px;
  font-size:20px;
  border:none;
  border-radius:50px;
  background:#ff2e63;
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,46,99,0.6);
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 40px rgba(255,46,99,1);
}

/* Heart container */
.heart-container{
  position:absolute;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* Heart shape */
.heart{
  width:150px;
  height:150px;
  background:#ff2e63;
  position:relative;
  transform:rotate(-45deg) scale(0);
  animation:pop 1s forwards;
  box-shadow:0 0 50px #ff2e63;
}

.heart::before,
.heart::after{
  content:"";
  width:150px;
  height:150px;
  background:#ff2e63;
  border-radius:50%;
  position:absolute;
}

.heart::before{
  top:-75px;
  left:0;
}

.heart::after{
  left:75px;
  top:0;
}

/* Text inside heart */
.text{
  position:absolute;
  color:white;
  font-size:24px;
  font-weight:bold;
  
  opacity:0;
  animation:fadeIn 1s forwards;
  animation-delay:0.8s;
}

/* Animations */
@keyframes pop{
  0%{
    transform:rotate(-45deg) scale(0);
  }
  60%{
    transform:rotate(-45deg) scale(1.2);
  }
  100%{
    transform:rotate(-45deg) scale(1);
  }
}

@keyframes fadeIn{
  to{
    opacity:1;
  }
}

/* floating effect */
@keyframes float{
  0%,100%{
    transform:rotate(-45deg) translateY(0);
  }
  50%{
    transform:rotate(-45deg) translateY(20px);
  }
}

.float{
  animation:float 2s infinite ease-in-out;
}
</style>
</head>
<body>

<button onclick="showHeart()">Open</button>

<div class="heart-container" id="heartBox">
  <div class="heart float"></div>
  <div class="text">Fatima</div>
</div>

<script>
function showHeart(){
  document.querySelector("button").style.display="none";
  document.getElementById("heartBox").style.display="flex";
}
</script>

</body>
</html>
